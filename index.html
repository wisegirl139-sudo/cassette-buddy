<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Cassette Buddy</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Coral+Pixels&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Pixels&display=swap" rel="stylesheet">
  
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
      }
    }
    </script>

  </head>
  <body>
    <header>
      <h1>Cassette Buddy</h1>
      <p>music really is a humans best friend</p>
    </header>
    <main>
      <section id="user">
        <div id="sce"><p id="stat">loading ur Cassette</p></div>
        <div id="song">
          <h2 id="songt">your song be like</h2>
          <p id="songn">no song selected</p>
        </div>
        
        <audio id="sound"></audio>
        <div class="prog">
          <span id="time">0:00</span>
          <input id="seek" type="range" min="0" max="100" value="0">
          <span id="dur">0:00</span>
        </div>
        <div class="cont">
          <button id="play" disabled>PLAY</button>
          <label class="up">
            add a song!!!!
            <input id="up" type="file" accept="audio/*" multiple>
          </label>
        </div>
        <div class="vol">
          <label for="vol">Volume</label>
          <input id="vol" type="range" min="0" max="1" step="0.01" value="0.7">
        </div>
        <div id="playlist"></div>
      </section>
      <div id="notes"></div>
      <section id="rooms">
        <h2>listen together</h2>
        <button id="creroom">create room</button>
        <div>
          <input id="roomcode" type="text" placeholder="enter room code" maxlength="6">
          <button id="joinroom">join room</button>
        </div>
        <p id="roomstat">not connected to a room</p>
      </section>
    </main>
    <script type="module" src="script.js"></script>
  </body>
</html>
